<!--
  Version-controlled copy of the NYU Abu Dhabi group's Header HTML.
  Live code is managed in the LibGuides admin interface:
  Admin > Groups > Abu Dhabi Library (group ID 5749) > Look & Feel > Header & Footer
  with "Exclude system level Header code." checked.
  If you change it there, update this file too (and vice versa).
  Mirrors the system-level header (layouts/header.html) so the shared CSS
  (scss/_header.scss) gives it the same left alignment and band styling as
  the NYU Libraries header. The logo displays at 235x59 (the SVG's
  210.29x52.76 aspect ratio at 59px tall) so the English "NYU|ABU DHABI"
  row renders at the same 30px height as the NYU Libraries wordmark.
  Previous (retired) version: backup/banner-image-header.html.bak
-->
<header class="header">
	<div class="container">
		<div class="logo vertical-center">
			<a href="https://nyuad.nyu.edu/en/library.html" title="NYU Abu Dhabi Library Homepage">
				<img src="https://cdn.library.nyu.edu/images/abudhabi_white.svg" alt="NYU Abu Dhabi logo" width="235"
					height="59">
			</a>
		</div>
	</div>
</header>

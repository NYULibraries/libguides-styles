<!--
  Version-controlled copy of the NYU Shanghai group's Header HTML.
  Live code is managed in the LibGuides admin interface:
  Admin > Groups > NYU Shanghai (group ID 5748) > Look & Feel > Header & Footer
  with "Exclude system level Header code." checked.
  If you change it there, update this file too (and vice versa).
  Mirrors the system-level header (layouts/header.html) so the shared CSS
  (scss/_header.scss) gives it the same left alignment and band styling as
  the NYU Libraries header. The logo displays at 262x59 (the SVG's 246.22x55.44
  aspect ratio at 59px tall) to match the NYU Abu Dhabi group header
  (groups/nyu-abudhabi-5749), so both global-campus headers render the same
  purple band height.
  Previous (retired) version: backup/banner-image-header.html.bak
-->
<header class="header">
	<div class="container">
		<div class="logo vertical-center">
			<a href="https://library.shanghai.nyu.edu/" title="NYU Shanghai Library Homepage">
				<img src="https://cdn.library.nyu.edu/images/nyushanghai_long_white.svg" alt="NYU Shanghai logo" width="262"
					height="59">
			</a>
		</div>
	</div>
</header>
